services:
  second-brain:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.32.15
    container_name: second-brain-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    security_opt:
      - no-new-privileges:true

volumes:
  ollama-data:
